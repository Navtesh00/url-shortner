name: CI

on:
  push:
    branches: [main, write-behind-cache]
  pull_request:
    branches: [main, write-behind-cache]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Publish coverage badge
        uses: tj-actions/coverage-badge-js@v2
        with:
          report_path: backend/coverage/coverage-summary.json
          output_path: backend/coverage/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update coverage badge
          branch: ${{ github.ref_name }}
          file_pattern: backend/coverage/coverage.svg
