name: CI

on:
  push:
    branches: [main, write-behind-cache]
  pull_request:
    branches: [main, write-behind-cache]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Publish coverage badges
        uses: danielmichael1994/actions-coverage-badge@v1
        with:
          fail_below_threshold: true
          thresholds: 70 70 70 70
          generate_badge: true
          output_path: backend/coverage/coverage.svg

      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update coverage badge
          branch: ${{ github.ref }}
          file_pattern: backend/coverage/coverage.svg
